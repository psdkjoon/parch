name: Build and Publish

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get

      - run: dart compile exe bin/parch.dart -o parch

      - uses: actions/upload-artifact@v4
        with:
          name: parch-linux-x64
          path: parch

  aur:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate PKGBUILD for this build
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          cat > PKGBUILD << PKGEOF
          # Maintainer: psdk <psdkjoon@gmail.com>
          pkgname=psdk-arch
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="psdk's arch installer and configer"
          arch=('x86_64')
          url="https://github.com/${{ github.repository }}"
          license=('MIT')
          makedepends=('dart')
          source=("\$pkgname-\$pkgver.tar.gz::https://github.com/${{ github.repository }}/archive/refs/heads/main.tar.gz")
          sha256sums=('SKIP')

          build() {
            cd "\$srcdir"/*-main
            dart pub get
            dart compile exe bin/parch.dart -o parch
          }

          package() {
            cd "\$srcdir"/*-main
            install -Dm755 parch "\$pkgdir/usr/bin/parch"
            if [ -f README.md ]; then
              install -Dm644 README.md "\$pkgdir/usr/share/doc/\$pkgname/README.md"
            fi
          }
          PKGEOF

      - name: Publish to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: psdk-arch
          pkgbuild: PKGBUILD
          commit_username: psdkjoon
          commit_email: psdkjoon@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "Update to ${{ env.VERSION }}"
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install s3cmd
        run: sudo apt-get update -y && sudo apt-get install -y s3cmd
      - name: Write s3cmd config
        run: |
          cat > "$HOME/.s3cfg" <<EOF
          [default]
          access_key = ${{ secrets.ARVAN_ACCESS_KEY }}
          secret_key = ${{ secrets.ARVAN_SECRET_KEY }}
          host_base = https://s3.ir-thr-at1.arvanstorage.ir
          host_bucket = https://s3.ir-thr-at1.arvanstorage.ir
          use_https = True
          EOF

      - name: Sync to bucket
        run: |
          s3cmd sync \
            --acl-public \
            --delete-removed \
            --guess-mime-type \
            --no-mime-magic \
            --exclude '.git/*' \
            --exclude '.github/*' \
            ./ "s3://psdk-arch/"
